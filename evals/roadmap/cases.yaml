# Eval cases for /kit:roadmap (spec: roadmap). Scripts run for real in the sandbox; the judgment
# cases are prompt + rubric and stay pending until scored (--scores), as for the other skills.
skill: roadmap
vars:
  r: '{{kit}}/scripts/roadmap.mjs'

cases:
  - id: no-roadmap-is-fine
    description: A project without a roadmap gets a note that it's optional, exit 0
    checks:
      - kind: command-exit
        command: node "{{r}}" check --dir .
        stdout_match: 'No roadmap here \(optional\)'

  - id: finish-moves-to-done
    description: Finishing a milestone moves its file to done/ and keeps its ID in the order
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n\n## Now\n\nWorking on M1.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-first.md: "---\nid: M1\ntitle: First\nstatus: active\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Done\n"
    checks:
      - kind: command-exit
        command: node "{{r}}" status --id M1 --to done --dir .
        stdout_match: 'M1: active -> done \(moved to done/\)'
      - { kind: content-match, path: 'knowledge/roadmaps/done/m1-first.md', pattern: 'status: done' }
      - kind: command-exit
        command: node "{{r}}" check --dir .
        stdout_match: 'in good condition'

  - id: report-blocking-now
    description: The report puts the current milestone's decision under Blocking now and counts later ones
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M2\n- M3\n\n## Now\n\nM1.\n\n## Waiting on you\n\n- [M1] Which layout? (proposed 2026-10-17)\n- [M3] Which host? (proposed 2026-10-17)\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-a.md: "---\nid: M1\ntitle: A\nstatus: active\n---\n\nG.\n\n- [ ] T1 a\n"
        knowledge/roadmaps/milestones/m2-b.md: "---\nid: M2\ntitle: B\nstatus: planned\n---\n\nG.\n"
        knowledge/roadmaps/milestones/m3-c.md: "---\nid: M3\ntitle: C\nstatus: planned\n---\n\nG.\n"
    checks:
      - kind: command-exit
        command: node "{{r}}" report --dir .
        stdout_match: 'Blocking now \(1\)\s+M1  Which layout\?[\s\S]*Later \(1\)\s+M3  Which host\?'

  - id: triggers-in-description
    description: The description names the moments it should trigger on so routing finds it
    checks:
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: '^description: .*roadmap' }
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: '^description: .*reprioritise' }
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: '^description: .*archived' }

  - id: create-only-on-yes
    description: With no roadmap, the skill offers to create one and writes nothing before a yes
    input:
      prompt: "/kit:roadmap  (answer: no, not now)"
    checks:
      - kind: rubric
        criteria:
          - name: says-optional
            description: Says a roadmap is optional and what it is for
          - name: writes-nothing
            description: After "no", no knowledge/roadmaps/ folder exists

  - id: proposes-reorder-only
    description: The agent thinks the order is wrong; it proposes with a reason and changes nothing without a yes
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M2\n\n## Now\n\nM1.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-polish.md: "---\nid: M1\ntitle: Polish colours\nstatus: planned\n---\n\nNicer colours.\n"
        knowledge/roadmaps/milestones/m2-login-fix.md: "---\nid: M2\ntitle: Fix broken login\nstatus: planned\n---\n\nUsers can't log in.\n"
    input:
      prompt: "/kit:roadmap show me the roadmap  (answer: no to any change)"
    checks:
      - kind: rubric
        criteria:
          - name: proposes-with-reason
            description: May suggest M2 before M1, with its reason
          - name: order-unchanged
            description: knowledge/roadmaps/roadmap.md still lists M1 before M2

  - id: never-hand-edits
    description: Writes go through the script; the skill says so
    checks:
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: 'Never edit the roadmap files by hand' }
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: 'Order and scope are the user' }

  # ---------- tracks and checkpoints (change roadmap-tracks-checkpoint) ----------

  - id: rename-keeps-id
    description: edit renames a milestone; ID and file name stay, the old title goes in the drift log
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M4\n\n## Now\n\nM4.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m4-board.md: "---\nid: M4\ntitle: Board\nstatus: active\n---\n\nGoal.\n\n## Tasks\n\n- [ ] T1 One\n"
    checks:
      - kind: command-exit
        command: node "{{r}}" edit --id M4 --title "Feature A" --dir .
        stdout_match: 'M4: renamed Board -> Feature A'
      - { kind: content-match, path: 'knowledge/roadmaps/milestones/m4-board.md', pattern: 'title: Feature A' }
      - { kind: content-match, path: 'knowledge/roadmaps/drift-log.md', pattern: 'M4 renamed: Board -> Feature A' }

  - id: checkpoint-reached-on-tick
    description: Ticking the checkpoint task says it is reached and shows both tracks with last and next task text
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M4\n\n## Now\n\nM4.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-b.md: "---\nid: M1\ntitle: Feature B v1\nstatus: paused\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Import\n- [ ] T2 Scoring\n\n## Notes\n\nResume: scoring weights still open\n"
        knowledge/roadmaps/milestones/m4-a.md: "---\nid: M4\ntitle: Feature A\nstatus: active\ncheckpoint: T2\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Model\n- [ ] T2 List view\n- [ ] T3 Save\n"
    checks:
      - kind: command-exit
        command: node "{{r}}" tick --id M4 --task T2 --dir .
        stdout_match: 'Checkpoint reached on M4 \(after T2\)\. Continue or switch\?[\s\S]*last done: T1 Import[\s\S]*resume: +scoring weights still open[\s\S]*last done: T2 List view[\s\S]*next: +T3 Save'
      - { kind: content-match, path: 'knowledge/roadmaps/milestones/m4-a.md', pattern: 'status: active' }

  - id: decide-switch-logs-and-saves-note
    description: decide --switch-to pauses one, starts the other, saves the resume note and logs the answer
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M4\n\n## Now\n\nM4.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-b.md: "---\nid: M1\ntitle: Feature B v1\nstatus: paused\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Import\n- [ ] T2 Scoring\n"
        knowledge/roadmaps/milestones/m4-a.md: "---\nid: M4\ntitle: Feature A\nstatus: active\ncheckpoint: T1\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Model\n- [ ] T2 List view\n"
    checks:
      - kind: command-exit
        command: node "{{r}}" decide --id M4 --switch-to M1 --why "demo next week" --resume "stopped after T1 Model; next T2 List view" --dir .
        stdout_match: 'M4: switched to M1 \(M4 paused, resume note saved\)'
      - { kind: content-match, path: 'knowledge/roadmaps/milestones/m4-a.md', pattern: 'status: paused' }
      - { kind: content-match, path: 'knowledge/roadmaps/milestones/m4-a.md', pattern: 'checkpoint:', negate: true }
      - { kind: content-match, path: 'knowledge/roadmaps/milestones/m4-a.md', pattern: 'Resume: stopped after T1 Model; next T2 List view' }
      - { kind: content-match, path: 'knowledge/roadmaps/milestones/m1-b.md', pattern: 'status: active' }
      - { kind: content-match, path: 'knowledge/roadmaps/drift-log.md', pattern: 'Checkpoint M4 after T1: switched to M1 \| demo next week' }

  - id: checkpoint-moment-in-skill
    description: The skill asks once at a reached checkpoint, drafts the resume note, and never switches on its own
    checks:
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: 'A checkpoint is reached' }
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: 'Never switch on your own' }
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: 'keep, correct or skip' }
      - { kind: content-match, path: '{{kit}}/skills/roadmap/SKILL.md', pattern: '^description: .*checkpoint' }

  - id: checkpoint-asks-once-with-both-tracks
    description: At a reached checkpoint the agent shows both tracks and asks continue or switch once, writing nothing without an answer
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M4\n\n## Now\n\nM4.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-b.md: "---\nid: M1\ntitle: Feature B v1\nstatus: paused\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Import\n- [ ] T2 Scoring\n"
        knowledge/roadmaps/milestones/m4-a.md: "---\nid: M4\ntitle: Feature A\nstatus: active\ncheckpoint: T1\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Model\n- [ ] T2 List view\n"
    input:
      prompt: "/kit:roadmap where are we?  (then say nothing more)"
    checks:
      - kind: rubric
        criteria:
          - name: both-tracks
            description: Shows M4 and M1 with each one's last done and next task by number and text
          - name: asks-once
            description: Asks "continue Feature A or switch to Feature B v1?" once, not repeatedly
          - name: writes-nothing
            description: No milestone or drift-log file changed without an answer

  - id: switch-drafts-resume-note
    description: On a switch the agent drafts the resume note from last, next and open change, and offers keep, correct or skip
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M4\n\n## Now\n\nM4.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-b.md: "---\nid: M1\ntitle: Feature B v1\nstatus: paused\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Import\n- [ ] T2 Scoring\n"
        knowledge/roadmaps/milestones/m4-a.md: "---\nid: M4\ntitle: Feature A\nstatus: active\ncheckpoint: T1\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Model\n- [ ] T2 List view\n"
    input:
      prompt: "/kit:roadmap I want to switch to Feature B now, the demo needs it  (answer: yes to the note as drafted)"
    checks:
      - kind: rubric
        criteria:
          - name: drafts-note
            description: Drafts a note naming T1 Model as last done and T2 List view as next, and offers keep, correct or skip
          - name: one-decide
            description: Writes with one decide --switch-to M1 call with --why and --resume; M4 paused, M1 active, drift entry added

  - id: skipped-resume-note
    description: When the user skips the note, the switch still happens and the Notes are unchanged
    setup:
      files:
        knowledge/roadmaps/roadmap.md: "# Roadmap\n\n## North star\n\nX.\n\n## Principles\n\n- Y.\n\n## Order\n\n- M1\n- M4\n\n## Now\n\nM4.\n\n## Waiting on you\n\n"
        knowledge/roadmaps/drift-log.md: "# Drift log\n\n| Date | What changed | Why | On-plan alternative | Impact | Decided by |\n|---|---|---|---|---|---|\n"
        knowledge/roadmaps/milestones/m1-b.md: "---\nid: M1\ntitle: Feature B v1\nstatus: paused\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Import\n- [ ] T2 Scoring\n"
        knowledge/roadmaps/milestones/m4-a.md: "---\nid: M4\ntitle: Feature A\nstatus: active\ncheckpoint: T1\n---\n\nGoal.\n\n## Tasks\n\n- [x] T1 Model\n- [ ] T2 List view\n"
    input:
      prompt: "/kit:roadmap switch to Feature B  (answer: skip the note)"
    checks:
      - kind: rubric
        criteria:
          - name: switch-without-note
            description: decide --switch-to M1 runs without --resume; M4 has no Resume line
