# Eval cases for /kit:start (spec: project-starter). Real git and openspec run inside the temp sandbox;
# --home points the machine project list at the sandbox, so the real ~/.claude is never touched.
skill: start
vars:
  plan: '{{kit}}/scripts/start-plan.mjs'
  apply: '{{kit}}/scripts/start-apply.mjs'
  prereqs: '{{kit}}/scripts/prereqs.mjs'

cases:
  - id: empty-folder-gets-tier2-basics
    description: An empty folder gets git, .gitignore (personal settings ignored), OpenSpec pointing at the context doc, CLAUDE.md routing, context doc, stamp, and a project-list entry
    setup:
      files:
        absent.js: "process.exit(require('fs').existsSync(process.argv[2]) ? 1 : 0)"
    input:
      run: node "{{apply}}" --dir . --type none --home home
    checks:
      - { kind: file-exists, path: .git }
      - { kind: file-exists, path: docs/project-context.md }
      - { kind: file-exists, path: .claude/kit.json }
      - { kind: git-ignored, path: .claude/settings.local.json }
      - { kind: content-match, path: .gitignore, pattern: '^# kit:start' }
      - { kind: content-match, path: openspec/config.yaml, pattern: 'docs/project-context\.md' }
      - { kind: content-match, path: CLAUDE.md, pattern: '<!-- kit:routing:start -->[\s\S]*/opsx:apply[\s\S]*<!-- kit:routing:end -->' }
      - { kind: content-match, path: home/.claude/kit/projects.json, pattern: '"projects"' }
      - kind: command-exit
        description: user-level Claude settings are never written
        command: node absent.js home/.claude/settings.json
        expect: 0

  - id: idempotent-rerun
    description: Running the starter twice with the same choices leaves nothing to change
    checks:
      - kind: command-exit
        command: node "{{apply}}" --dir . --type none --home home
        expect: 0
      - kind: command-exit
        command: node "{{apply}}" --dir . --type none --home home
        expect: 0
      - kind: command-exit
        command: node "{{plan}}" --dir . --type none
        expect: 0
        stdout_match: 'Nothing to change\.'

  - id: existing-claude-md-unchanged-without-yes
    description: A user-edited CLAUDE.md is shown as a diff and left byte-identical unless confirmed
    setup:
      files:
        CLAUDE.md: "# My project\n\nMy own rules.\n"
    checks:
      - kind: command-exit
        command: node "{{plan}}" --dir . --type none
        stdout_match: 'CHANGE\s+CLAUDE\.md[\s\S]*\+ <!-- kit:routing:start -->'
      - kind: command-exit
        command: node "{{apply}}" --dir . --type none --home home
        stdout_match: 'skipped\s+CLAUDE\.md: not confirmed'
      - kind: content-match
        path: CLAUDE.md
        pattern: '^# My project\r?\n\r?\nMy own rules\.\r?\n$'
        negate: false

  - id: missing-git-stops-before-writes
    description: With git missing, the prerequisite check blocks with an install hint and nothing is written
    setup:
      files:
        blocked.mjs: "import { pathToFileURL } from 'node:url'; const m = await import(pathToFileURL(process.argv[2]).href); const r = m.checkPrereqs({ locateFn: () => null, setupDeps: { platform: 'win32', userSettings: () => ({}), run: () => ({ status: 1, stdout: '', stderr: '' }) } }); console.log(m.formatPrereqs(r)); process.exit(r.ready ? 0 : 9);"
        absent.js: "process.exit(require('fs').existsSync(process.argv[2]) ? 1 : 0)"
    checks:
      - kind: command-exit
        command: node blocked.mjs "{{prereqs}}"
        expect: 9
        stdout_match: 'BLOCKED\s+git is missing\. Install: [\s\S]*Nothing was changed\.'
      - { kind: command-exit, command: node absent.js CLAUDE.md, expect: 0 }
      - { kind: command-exit, command: node absent.js .git, expect: 0 }

  - id: plugins-enabled-only-in-the-project
    description: A project plugin lands in the project's .claude/settings.json (CLI or fallback), never in user-level settings
    setup:
      files:
        absent.js: "process.exit(require('fs').existsSync(process.argv[2]) ? 1 : 0)"
        r.json: '{"phases":[],"tools":[{"name":"fakeplug","tier":"project","status":"trial","scope":"project","plugin":"fakeplug@kit-eval-nowhere","check":"node absent.js .","install":{"win32":"x","linux":"x","darwin":"x"}}]}'
    checks:
      - kind: command-exit
        command: node "{{apply}}" --dir . --type none --opt-in fakeplug --home home --registry r.json
        stdout_match: 'enabled\s+fakeplug \(written to \.claude/settings\.json'
      - { kind: content-match, path: .claude/settings.json, pattern: '"fakeplug@kit-eval-nowhere": true' }
      - kind: command-exit
        command: node absent.js home/.claude/settings.json
        expect: 0

  - id: skill-confirms-and-never-goes-global
    description: The skill asks before changing existing files and forbids user-scope installs
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Never apply a change the user didn.t confirm' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Never pass `--scope user`' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\$\{CLAUDE_PLUGIN_ROOT\}/scripts/start-apply\.mjs' }

  - id: knowledge-folder-and-routing
    description: A fresh project gets the four knowledge subfolders and the routing Knowledge section (prd-pipeline 5.4)
    input:
      run: node "{{apply}}" --dir . --type none --home home
    checks:
      - { kind: file-exists, path: knowledge/notes/.gitkeep }
      - { kind: file-exists, path: knowledge/prds/.gitkeep }
      - { kind: file-exists, path: knowledge/assets/.gitkeep }
      - { kind: file-exists, path: knowledge/archive/.gitkeep }
      - { kind: content-match, path: .claude/kit.json, pattern: '"knowledge_dir": "knowledge"' }
      - { kind: content-match, path: CLAUDE.md, pattern: '### Knowledge and PRDs[\s\S]*PRD: knowledge/prds/<slug>\.md @ <commit>[\s\S]*<!-- kit:routing:end -->' }

  - id: skill-mentions-knowledge-not-notion
    description: The start skill reports the knowledge folder and no longer uses Notion as its example
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'the knowledge folder' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Notion', negate: true }

  - id: plan-json-recommends-web-ui-for-next
    description: In a folder with next.config.js, the plan JSON recommends web-ui with its reason (followups 5.2)
    setup:
      files:
        next.config.js: "module.exports = {}\n"
    checks:
      - kind: command-exit
        command: node "{{plan}}" --dir . --type none --json
        stdout_match: '"name": "web-ui",[\s\S]*?"recommended": true,\s*"why": "found next\.config\.js: this is a web app"'
      - kind: command-exit
        command: node "{{plan}}" --dir . --type none --json
        stdout_match: '"offeredTools"'

  - id: skill-one-question-setup
    description: The start skill asks one question (type), lists opt-ins as on demand, and confirms file changes with one yes (followups 5.4)
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'On a first setup it asks one question: the project type' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Ask nothing else about tools' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'typeOptions' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'available on demand' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Ask \*\*one\*\* question, \*\*with the AskUserQuestion tool\*\*' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'one question each', negate: true }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'A recommendation is not an answer\.' }

  - id: summary-three-parts
    description: The start skill summarizes in Done / Needs you / Later and hides internal notes (followups 5.5)
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Summarize in three parts' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\*\*Needs you:\*\* only steps that block using the project \*\*now\*\*' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: "Don't repeat internal install notes" }

  - id: questions-are-clickable
    description: The type question and the confirm question use the AskUserQuestion tool, recommended option first
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Ask with the AskUserQuestion tool\*\* \(clickable options\)' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'with the AskUserQuestion tool\*\*: "Apply all \(Recommended\)"' }
      - { kind: content-match, path: '{{kit}}/skills/ready/SKILL.md', pattern: 'Ask once with \*\*AskUserQuestion\*\*: accept the recommendation' }

  - id: summary-mentions-kit-docs
    description: The Later part mentions /kit:docs once, and the starter creates no docs folders (kit-docs, project-starter "Docs page mentioned at setup")
    checks:
      - { kind: content-match, path: '{{kit}}/scripts/start-plan.mjs', pattern: "optional: when you want a browsable page of what's built .* run /kit:docs, any time, also mid-project" }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: "planner's \"Later\" lines as printed \\(including its `/kit:docs` and `/kit:roadmap` lines" }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: "Don't create `knowledge/docs/`, `knowledge/foundations/` or `knowledge/roadmaps/`" }

  - id: summary-mentions-kit-roadmap
    description: The Later part mentions /kit:roadmap once; the starter never asks about or creates a roadmap (roadmap-structure, project-starter "Roadmap mentioned at setup")
    checks:
      - { kind: content-match, path: '{{kit}}/scripts/start-plan.mjs', pattern: "optional: when you want the goals in order, what's left and the decisions waiting in one place, run /kit:roadmap" }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: "don't ask about a roadmap" }

  - id: resync-files-only
    description: A re-sync with pending installs offers files only; a fresh setup asks nothing about tools (kit-followups, project-starter "Re-sync without tool installs")
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Files only \(no installs or updates now\)' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'A fresh setup with no `UPDATE` line, or a re-sync with no `INSTALL` or `UPDATE` line, asks nothing about tools' }
      - { kind: content-match, path: '{{kit}}/scripts/start-plan.mjs', pattern: "a === '--files-only'" }

  # first-run-guidance 4.1 (spec: project-starter "Machine tools are checked first", "Project context filled at setup", "First step after setup")
  - id: first-run-setup-context-and-first-step
    description: Setup offered on a yes; the context doc offered right after a fresh setup (draft or five questions, written on a yes); a new project ends with /kit:capture or /opsx:explore
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Install them now with /kit:setup \(Recommended\)' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'only when this run created `docs/project-context.md`' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'as text in your message' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\*\*Rules the agent must follow:\*\*' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Not `/kit:next`: it has nothing to suggest yet' }
      - { kind: content-match, path: '{{kit}}/templates/project-context.md', pattern: '^## Rules the agent must follow$' }

  # first-run-guidance (spec review S1, code review C5, C7)
  - id: setup-offered-when-blocked-once-and-next-from-script
    description: A BLOCKED check offers /kit:setup too, setup is offered once per run, and the last step comes from next.mjs
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Install with /kit:setup now \(Recommended\)' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Offer setup once per run' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'from the same test `/kit:next` uses' }

  # context-review-step 1.1 (spec: project-starter "Project context filled at setup": Source first, Draft from the project, Never ask about unseen text)
  - id: your-project-stage-visible
    description: The context step is its own stage; it asks about the source first, shows the draft as text before asking, and never asks about unseen text
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\*\*Your project\*\* \(its own stage' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'ask \*\*before drafting anything\*\*' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Is this right about your project\?' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'never ask the user to approve text they can.t see' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'nothing here describes the project yet' }
  - id: your-project-stage-sources-and-exits
    description: The kit's own new files aren't sources; thin sources go to the questions; Later is always an option (code review of context-review-step)
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\*\*Not sources:\*\* what this run just wrote' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\*\*Too little to go on\*\*' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '"Later" stays an option every time' }
  - id: context-questions-two-rounds-and-type-order
    description: web-ui first without evidence and none last; the core three questions first with a voice hint, then two optional; the docs/ line at the end (context-questions-polish)
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Otherwise `web-ui` goes first when it.s offered, \*\*without\*\* "Recommended"' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '"none" always goes last' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Round 1, the core three' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'answer by voice \(`/voice`\)' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Round 2, two optional ones' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Put them in `docs/`' }
  - id: start-closes-with-openspec-line
    description: 'the summary ends with where /opsx: comes from (a short OpenSpec link), /kit:next as the guide, and Have fun! (start-closing-line)'
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'come from \[OpenSpec\]\(https://github\.com/Fission-AI/OpenSpec\)' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '`/kit:next` guides you through them: explore, propose, apply, archive' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '\*\*Have fun!\*\*' }
  - id: resync-updates-old-tools
    description: 'UPDATE lines and warnings explained; the tools question also on UPDATE lines; updated tools in Done (tool-version-sync)'
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '`UPDATE`: a tool in this project is older than the version the kit tested' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'never downgraded' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'or any run whose plan shows `UPDATE` lines' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Show it with its update command; don.t run it' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'say so and stop, after showing any `WARNING` line' }
  - id: setup-commit-offered
    description: 'The summary offers to commit the setup on its own before a change starts; the OpenSpec config gets the tasks rule (build-prereqs)'
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: 'Commit the setup on its own before you start a change' }
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: '"Commit the setup now\?"' }
      - { kind: content-match, path: '{{kit}}/scripts/start-plan.mjs', pattern: "Don't add tasks that need a running app, a browser or a check by hand" }
  - id: resync-reuses-saved-type
    description: 'A re-sync takes the type from .claude/kit.json and does not ask (rc-fixes)'
    checks:
      - { kind: content-match, path: '{{kit}}/skills/start/SKILL.md', pattern: "When the plan has `savedType`" }
      - { kind: content-match, path: '{{kit}}/scripts/start-plan.mjs', pattern: 'savedType: savedType\(stampCur\)' }
