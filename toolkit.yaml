# Toolkit registry: every tool the kit knows, why it's here, and its verdict.
# Edit by hand, then validate and regenerate the runtime copy:
#   npm run registry          (writes plugins/kit/data/toolkit.json only when valid)
# Field reference: docs/registry.md. Spec: openspec/specs/toolkit-registry/spec.md
version: 1

# Workflow phases. Each one gets exactly one owner (lane map, spec: skill-routing).
phases: [capture, prd, brainstorm, artifacts, plan, build, verify, review, ui-polish, close, kit-issues]

# Test policy per project type (spec: toolkit-registry "Test policy per project type").
# /kit:verify runs these package.json scripts. Projects without a type use "none".
project_types:
  web-ui:
    tests:
      - { script: test, required: true }
      - { script: "test:integration", required: false }
    missing_required: hard
    advisory: []
  none:
    tests:
      - { script: test, required: false }
    missing_required: advisory
    advisory: []

# Situation-to-skill guide, shown in the cockpit.
situations:
  - when: I have an idea or a note to keep
    phase: capture
    use: /kit:capture
  - when: I want to turn notes into a PRD
    phase: prd
    use: /kit:prd
  - when: I have a new idea or feature
    phase: brainstorm
    use: /opsx:explore
  - when: I'm ready to write it down as a change
    phase: artifacts
    use: /opsx:propose
  - when: the plan is done and I want to build
    phase: build
    use: /opsx:apply
  - when: the change is big or risky
    use: SuperSpec flow (/opsx:ff -> /opsx:apply -> /opsx:verify), trial
  - when: I'm about to commit
    use: gitleaks pre-commit hook (runs automatically)
  - when: the kit itself got in my way
    phase: kit-issues
    use: /kit:feedback

tools:
  - name: openspec
    source: npm:@fission-ai/openspec
    tier: global
    reason: Spec-driven change workflow (explore, proposal, specs, design, tasks, apply, archive); the kit's default workflow
    cost: free
    status: adopted
    scope: machine
    check: openspec --version
    install:
      win32: npm install -g @fission-ai/openspec
    rubric:
      problem_fit: Structured, reviewable planning that lives in the repo
      overlap: SuperSpec and Superpowers claim the same phases; resolved on their entries
      context_cost: Low; skills load on demand
      run_cost: Free CLI; only Claude usage while working
      trust: Active open-source project (Fission-AI)
      reversibility: Delete openspec/ and .claude/ generated files
      license: MIT
    reviewed_version: 1.13.2
    reviewed_on: 2026-10-01
    phases: [brainstorm, artifacts, plan, build, verify, close]
    skills:
      brainstorm: /opsx:explore
      artifacts: /opsx:propose
      plan: /opsx:continue
      build: /opsx:apply
      verify: openspec validate --strict + the change's tests
      close: /opsx:archive
    # /kit:verify owns verify (quality-gates); openspec validate stays one of its inputs.
    overlaps: [kit]
    skip_skills: [openspec validate as the whole verify step]
    verdicts:
      - date: 2026-09-29
        status: trial
        rationale: In use for this repo's planning
      - date: 2026-10-01
        status: adopted
        rationale: A/B trial - same result as SuperSpec at about 1/4 of the time and 1/5 of the cost; default workflow
        evidence: evals/registry/runs/2026-10-01-openspec.json

  - name: superspec
    source: github:danielhanold/superspec
    tier: project
    reason: OpenSpec schema that wires in Superpowers (worktree, subagent TDD, verify) for big or risky changes
    recommend: 'no'
    recommend_why: Plain OpenSpec covers most changes; use SuperSpec for a big or risky one (payments, auth, data migration)
    cost: uses-claude-quota
    status: trial
    scope: project
    check: openspec schemas
    check_match: superspec
    interactive: true
    install:
      win32: copy openspec/schemas/superspec from github.com/danielhanold/superspec, then openspec init --tools claude --profile custom --force with XDG_CONFIG_HOME pointed at a throwaway config
    install_note: Multi-step and project-only - follow evals/trials/workflow-ab-setup.md (never change the global OpenSpec config). Automating it is a follow-up.
    rubric:
      problem_fit: Strong process (isolation, audit trail, verify report), asks instead of guessing
      overlap: Same phases as OpenSpec spec-driven; used per change, never as the default
      context_cost: High; 165 requests and 13 subagents for a small change
      run_cost: About 5x plain OpenSpec on the trial task
      trust: Small MIT project; schema v4
      reversibility: Remove openspec/schemas/superspec and switch the change schema back
      license: MIT
    reviewed_version: e1c8f41
    reviewed_on: 2026-10-01
    phases: [brainstorm, artifacts, plan, build, verify, close]
    skills:
      brainstorm: /opsx:new <name> --schema superspec
      artifacts: /opsx:continue (brainstorm -> proposal -> specs -> tasks)
      plan: /opsx:continue (plan artifact)
      build: /opsx:apply (worktree + subagent TDD)
      verify: /opsx:verify
      close: /opsx:archive
    overlaps: [openspec, kit]
    # Used per change for big or risky work; OpenSpec spec-driven stays the default.
    skip_skills: [superspec as the project default schema]
    verdicts:
      - date: 2026-10-01
        status: trial
        rationale: A/B trial - equal result, about 4x the time and 5x the cost on a small, tightly specified change; re-test on a big or risky one
        evidence: evals/registry/runs/2026-10-01-superspec.json

  - name: superpowers
    source: github:obra/superpowers-marketplace
    tier: project
    reason: Brainstorming, plan writing and subagent TDD; the build engine behind SuperSpec
    recommend: 'no'
    recommend_why: Only used inside SuperSpec's flow; say yes together with SuperSpec
    cost: uses-claude-quota
    status: trial
    scope: project
    plugin: superpowers@superpowers-marketplace
    check: claude plugin list --json
    check_match: '"id": "superpowers@superpowers-marketplace"[^}]*"projectEnabled": true'
    install:
      win32: claude plugin install superpowers@superpowers-marketplace --scope project --json
    rubric:
      problem_fit: Build discipline (TDD, small commits, worktrees)
      overlap: Planning skills overlap OpenSpec; used only through SuperSpec
      context_cost: Medium; session-start hook and many skills
      run_cost: Uses Claude quota; subagents add requests
      trust: Widely used; past Windows hook bugs, none seen here
      reversibility: Remove from the project's enabledPlugins
      license: MIT
    reviewed_version: 6.4.2
    reviewed_on: 2026-10-01
    # No phases of its own: it runs inside SuperSpec's flow, which owns the lanes.
    overlaps: [openspec, superspec]
    # Invoked by SuperSpec's flow; never directly (they would compete with OpenSpec's phases).
    skip_skills: [superpowers:brainstorming, superpowers:writing-plans, superpowers:executing-plans]
    verdicts:
      - date: 2026-10-01
        status: trial
        rationale: Windows smoke test passed (start, input, skills, per-project scoping); value shown in the SuperSpec build phase
        evidence: evals/trials/superpowers-smoke.md

  - name: gitleaks
    source: winget:Gitleaks.Gitleaks
    tier: global
    reason: Blocks commits that contain secrets; needed because the kit repo is public
    cost: free
    status: adopted
    scope: machine
    check: gitleaks version
    install:
      win32: winget install --id Gitleaks.Gitleaks -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
    rubric:
      problem_fit: Catches tokens and keys before they reach a public repo
      overlap: The feedback skill's text scrub covers a different case (text, not commits)
      context_cost: None; runs as a git hook outside Claude
      run_cost: Free; about 1 s per commit
      trust: Widely used, maintained
      reversibility: Unset core.hooksPath
      license: MIT
    reviewed_version: 8.30.1
    reviewed_on: 2026-10-01
    verdicts:
      - date: 2026-09-29
        status: adopted
        rationale: Hook blocked a fake token and passed clean commits; full history scan found no leaks
        evidence: openspec/changes/kit-local-mvp/tasks.md (task 1.6)

