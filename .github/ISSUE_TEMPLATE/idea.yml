name: Idea
description: Something the kit could do better, or doesn't do yet
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste secrets** or details of a private project; describe them generically instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in your way today, in your own words.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations:
      required: false
