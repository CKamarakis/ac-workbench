  - name: playwright-cli
    source: npm:@playwright/cli
    tier: project-type:web-ui
    reason: Browser checks for web UI projects - on demand only, through /kit:verify when the user asks (not on every verify)
    cost: free
    status: adopted
    scope: project
    check: playwright-cli --version && node -e "process.exitCode = Number(!require('fs').existsSync('.claude/skills/playwright-cli'))"
    install:
      win32: npm install -g @playwright/cli@latest && playwright-cli install --skills
    install_note: Verified 2026-10-01 (sandbox) - the CLI (0.1.22) is a machine-wide npm install (a CLI, inert until called); `playwright-cli install --skills` adds .claude/skills/playwright-cli to the project and uses the installed Chrome. A small helper (winldd) goes to the shared Playwright cache in AppData/Local/ms-playwright.
    rubric:
      problem_fit: Lets the agent check real pages and flows
      overlap: Playwright MCP does the same with more tokens; Claude in Chrome is for the user's own browser
      context_cost: Low; its docs say CLI + skills is more token-efficient than the MCP for coding agents
      run_cost: Free
      trust: Microsoft project
      reversibility: npm uninstall -g @playwright/cli; remove the skills folder
      license: Apache-2.0
    reviewed_version: readme 2026-10-01
    reviewed_on: 2026-10-01
    verdicts:
      - date: 2026-10-01
        status: later
        rationale: Not needed until a web UI project uses the kit; package name unverified
      - date: 2026-10-01
        status: trial
        rationale: Full README read; package @playwright/cli verified; CLI + skills preferred over MCP; trial on the first web-ui project
        evidence: evals/trials/tool-review-2026-10-01.md
      - date: 2026-10-08
        status: adopted
        rationale: M4 trial - logged in and drove protected pages on Windows (desktop + 390px), measured and screenshotted real issues the code reviews could only suspect (37px expand bar, mobile drawer ignores Escape); compact snapshots, cheap per check; used on demand by design. User confirmed
        evidence: evals/trials/design-trial.md

  - name: context7
    source: github:upstash/context7
    tier: global
    reason: Up-to-date, version-specific library docs for the agent (fewer hallucinated APIs)
    cost: free-tier
    status: trial
    scope: project
    check: node --version
    install:
      win32: nothing to install - the agent calls npx -y ctx7@latest library|docs when it needs docs (no sign-in)
    install_note: Verified 2026-10-07 - lookups (ctx7 library, ctx7 docs) work logged out; only ctx7 setup forces a browser sign-in, even with -y, so the kit skips setup and uses a routing rule instead. Limits without a key are unverified; a limit-hit message and the optional sign-in are deferred (roadmap).
    rubric:
      problem_fit: Fewer stale API answers during build
      overlap: None; a docs source, not a phase owner
      context_cost: Low in CLI + Skills mode; docs are fetched on demand
      run_cost: Free API key (higher rate limits); the backend is a hosted service
      trust: Upstash; community-contributed library docs (its disclaimer says it can't guarantee accuracy)
      reversibility: npx ctx7 remove
      license: MIT
    reviewed_version: readme 2026-10-01
    reviewed_on: 2026-10-01
    verdicts:
      - date: 2026-10-01
        status: later
        rationale: Not needed for the MVP
      - date: 2026-10-01
        status: trial
        rationale: Full README read; cheap insurance against outdated APIs; trial on the next build
        evidence: evals/trials/tool-review-2026-10-01.md
      - date: 2026-10-07
        status: trial
        rationale: Used through npx with no setup or sign-in (lookups work logged out); the routing block tells the agent when to look up docs
        evidence: evals/trials/prd-pipeline-live.md

