schema: spec-driven

# Project context, shown to AI when creating artifacts.
context: |
  Project: ac-workbench, a personal Claude Code kit (formerly prd-pipeline).
  Full living context, decisions and open ideas: docs/project-context.md. Read it before any proposal.
  Deliverable: a marketplace repo (.claude-plugin/marketplace.json) whose main plugin is `kit`
  (plugins/kit: skills, zero-dependency scripts, templates, generated data/toolkit.json).
  Kit pieces: toolkit registry (toolkit.yaml), skill evals, tool setup, skill routing, project starter, /kit:next.
  Order of work and current position: docs/roadmap.md (read it first). Milestones: prd-pipeline (built:
  voice/text -> note -> PRD in the project's knowledge/ folder -> /opsx:propose), quality gates next, then cockpit/feedback/harness review (change kit-overview-feedback).
  MVP is local-only and free: no paid services beyond the Claude plan; set up once, works in every project.
  Platform: Windows 11, Git Bash + PowerShell; global npm bins are not on the agent shell PATH.
  First test consumer: Toughbubble (Next.js, already on OpenSpec).

rules:
  proposal:
    - Include a visual aid (Mermaid diagram or ASCII flow) for any architecture or workflow change
    - Mark anything unverified against official docs as "unverified"
