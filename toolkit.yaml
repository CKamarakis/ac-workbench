  - name: notion-mcp
    source: https://mcp.notion.com/mcp
    tier: project
    reason: Context store outside the repo - capture, PRDs and retrieval in Notion (prd-pipeline)
    cost: free
    status: later
    scope: project
    check: claude mcp get notion
    check_match: 'Status:.*[Cc]onnected'
    install:
      win32: claude mcp add --transport http notion https://mcp.notion.com/mcp --scope local
    install_note: Then run /mcp in Claude Code and finish the OAuth sign-in. Verified 2026-10-01 - `--scope local` is private to you in this project (kept in ~/.claude.json under this project's path, not committed); until sign-in, `claude mcp get notion` shows "Needs authentication". The connected status wording is unverified.
    rubric:
      problem_fit: Keeps long-lived product context in Notion and only pointers and final PRDs in the repo
      overlap: The Notion plugin bundles the same server; use one of them per project
      context_cost: Low; hosted server returns Markdown and only the relevant context
      run_cost: Free plan covers search, fetch, create and update; AI search, meeting notes and agents need Notion AI
      trust: Official Notion server; OAuth respects your existing Notion permissions
      reversibility: claude mcp remove notion; revoke under Notion Settings > Connections
      license: Hosted service (the deprecated local server is MIT)
    reviewed_version: docs 2026-10-01
    reviewed_on: 2026-10-01
    verdicts:
      - date: 2026-10-01
        status: trial
        rationale: Official hosted server, per-project scope, core tools on the free plan; adopt once prd-pipeline uses it
        evidence: evals/trials/tool-review-2026-10-01.md
      - date: 2026-10-06
        status: later
        rationale: Live spike on the free plan - SQL queries hit the usage limit after about 10 calls; prd-pipeline v1 keeps PRDs as Markdown in knowledge/ instead
        evidence: evals/trials/notion-spike-2026-10-06.md

